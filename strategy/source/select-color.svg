<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-label="Select"><defs>
        <linearGradient id="base" x2="0" y2="1"><stop stop-color="#6D42D7"/><stop offset=".55" stop-color="#6D42D7"/><stop offset="1" stop-color="#6D42D7"/></linearGradient>
        <linearGradient id="sculpt" x1="0" y1="0" x2=".15" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".35" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EBECED"/></linearGradient>
        <linearGradient id="fade" x2="0" y2="1"><stop offset=".48" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".28"/></linearGradient>
        <linearGradient id="edge" x2="0" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".85"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".1"/><stop offset="1" stop-color="#47505E" stop-opacity=".15"/></linearGradient>
        <filter id="relief" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="3.6" stdDeviation="2.6" flood-color="#6D42D7" flood-opacity=".23"/></filter>
        <mask id="glyph" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><g transform="translate(128 127) scale(1.6173913) translate(-128.5 -135.5)"><path xmlns="http://www.w3.org/2000/svg" d="M85 78V177L111 155 128 193 152 182 135 146 172 145Z" fill="#FFFFFF" /></g></mask>
        <mask id="front-glyph" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><g transform="translate(128 127) scale(1.6173913) translate(-128.5 -135.5)"></g></mask>
        <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="54"/></clipPath>
