        <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#base)"/>
        <g clip-path="url(#tile)"><g filter="url(#relief)"><rect width="256" height="256" fill="url(#sculpt)" mask="url(#glyph)"/></g><rect x="8" y="8" width="240" height="240" fill="url(#fade)"/></g>
        <rect x="8.6" y="8.6" width="238.8" height="238.8" rx="53.4" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
