<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-label="DNS"><defs>
 <linearGradient id="plate" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F4F6FA"/><stop offset="1" stop-color="#E0E5ED"/></linearGradient>
 <radialGradient id="tint" cx=".5" cy=".42" r=".65"><stop stop-color="#7FDCDD" stop-opacity=".18"/><stop offset="1" stop-color="#7FDCDD" stop-opacity="0"/></radialGradient>
 <linearGradient id="body" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#7FDCDD"/><stop offset=".55" stop-color="#208D98"/><stop offset="1" stop-color="#208D98"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".75"/><stop offset=".22" stop-color="#7FDCDD" stop-opacity=".92"/><stop offset=".68" stop-color="#208D98" stop-opacity=".91"/><stop offset="1" stop-color="#208D98"/></linearGradient>
